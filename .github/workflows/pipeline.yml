name: Pipeline

# CI proves the code is sound; this proves the analysis still runs end to end
# against the live RCSB API. It needs no conda toolchain -- the numerical work
# is pure Biopython and RDKit -- so it stays fast enough to run on every push.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/plinter/**"
      - ".github/workflows/pipeline.yml"

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: End-to-end analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Python buffers stdout when it is not a TTY, so a hard crash discards
    # every progress line the CLI printed. Flush as we go so the log shows
    # where a run died.
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The locked set, not the newest one. A published result must not change
        # because a dependency shipped overnight; the drift job below is what
        # notices that it did.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run the analysis from a clean state
        run: |
          rm -rf data/pdb ci-results
          python -m plinter.cli --data-dir data/pdb --results-dir ci-results

      - name: Check the results still hold
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          summary = json.loads(Path("ci-results/summary.json").read_text())
          extras = json.loads(Path("ci-results/extras.json").read_text())

          by_ligand = {e["ligand"]: e for e in summary["per_ligand"]}
          if set(by_ligand) != {"MOT", "LII"}:
              sys.exit(f"unexpected ligands: {sorted(by_ligand)}")

          # Glu30 anchors the 2,4-diaminopyrimidine of both antifolates. If a
          # future RCSB revision or a code change loses that, the central claim
          # of this repository is wrong and the job should fail.
          shared = set(summary["comparison"]["shared_hydrogen_bond_residues"])
          if "GLU30" not in shared:
              sys.exit(f"Glu30 is no longer a shared H-bond partner: {sorted(shared)}")

          # Full recall against the depositors' annotation.
          for entry in extras["validation"]:
              if entry["recall_of_reference"] < 1.0:
                  sys.exit(f"{entry['reference']}: recall dropped to {entry['recall_of_reference']}")

          # PLIP types interactions from perceived chemistry rather than from
          # this pipeline's distance rules, so it is an independent check on the
          # discriminating result: MOT's glutamate tail reaches Arg70 and LII's
          # has no anion to pair with the guanidinium.
          plip = {e["ligand"]: e for e in extras.get("plip", [])}
          if not plip:
              sys.exit("PLIP profile missing; the independent cross-check did not run")
          if "ARG70" not in plip["MOT"]["residues"]:
              sys.exit(f"PLIP no longer places Arg70 in the MOT site: {plip['MOT']['residues']}")
          if "ARG70" in plip["LII"]["residues"]:
              sys.exit(f"PLIP now places Arg70 in the LII site: {plip['LII']['residues']}")
          for ligand in ("MOT", "LII"):
              if "GLU30" not in plip[ligand]["residues"]:
                  sys.exit(f"PLIP lost the Glu30 anchor for {ligand}")

          # The lipophilic analogue must remain the more lipophilic one.
          profiles = {p["ligand"]: p for p in extras["chemistry"]["profiles"]}
          if not profiles["LII"]["logp"] > profiles["MOT"]["logp"]:
              sys.exit("cLogP ordering reversed")

          print(f"MOT {by_ligand['MOT']['contacts']} contacts, "
                f"LII {by_ligand['LII']['contacts']} contacts")
          print("shared H-bond partners:", sorted(shared))
          print("PLIP cross-check: Arg70 for MOT only, Glu30 for both")
          print("analysis reproduced")
          PY

      - name: Upload outputs for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-results
          path: ci-results/
          retention-days: 7

  drift:
    name: Dependency drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Never fails the workflow. The analysis job proves the result still holds
    # on the locked set; this one reports, in the run summary, which upstream
    # releases the lock is currently holding back.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve the newest compatible set
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chemistry,plip]"

      - name: Report what moved
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, subprocess
          from pathlib import Path

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def parse(lines):
              out = {}
              for line in lines:
                  line = line.strip()
                  if line and not line.startswith("#") and "==" in line:
                      name, version = line.split("==", 1)
                      out[norm(name)] = version
              return out

          locked = parse(Path("requirements-lock.txt").read_text().splitlines())
          frozen = subprocess.run(
              ["pip", "freeze", "--exclude-editable"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          latest = parse(frozen)

          moved = [(n, locked[n], latest[n]) for n in sorted(locked)
                   if n in latest and locked[n] != latest[n]]
          added = sorted(set(latest) - set(locked))

          if not moved and not added:
              print("Lock matches the newest resolvable set.")
          else:
              print("### Newer than the lock\n")
              print("| package | locked | latest |")
              print("|---|---|---|")
              for name, was, now in moved:
                  print(f"| {name} | {was} | {now} |")
              for name in added:
                  print(f"| {name} | absent | {latest[name]} |")
              print("\nRegenerate the lock once the analysis is confirmed to still hold.")
          PY
